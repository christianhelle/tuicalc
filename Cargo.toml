[package]
name = "tuicalc"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A terminal spreadsheet editor for Excel .xlsx workbooks, with vim-style keys"
license = "MIT"
readme = "README.md"
homepage = "https://github.com/christianhelle/tuicalc"
repository = "https://github.com/christianhelle/tuicalc"
keywords = ["spreadsheet", "excel", "xlsx", "tui", "terminal"]
categories = ["command-line-utilities"]
exclude = [".github/", ".gitattributes", "docs/", "images/"]

[[bin]]
name = "tcalc"
path = "src/main.rs"

[dependencies]
crossterm = "0.29.0"
quick-xml = "0.42.0"
ratatui = "0.30.2"
tempfile = "3.27.0"
unicode-width = "0.2.3"
zip = { version = "9.2.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
insta = "1.49.0"
